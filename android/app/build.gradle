plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "com.example.townpass"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "29.0.13113456"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.townpass"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

// On-device assistant (docs/AI_ON_DEVICE_PLAN.md). Opt-in with TOWNPASS_ON_DEVICE=1
// or -Ptownpass.onDevice=true; other builds are unchanged. Packs the Python
// backend (Chaquopy) and the llama.cpp / whisper.cpp servers built by
// scripts/build_assistant_native.ps1. 64-bit devices only.
def assistantOnDevice = ["1", "true"].contains(
    (project.findProperty("townpass.onDevice") ?: System.getenv("TOWNPASS_ON_DEVICE") ?: "").toString())
if (assistantOnDevice) {
    apply plugin: "com.chaquo.python"
    android {
        defaultConfig {
            ndk { abiFilters "arm64-v8a", "x86_64" }
        }
        sourceSets.main {
            jniLibs.srcDirs += "assistant-native/jniLibs"
            java.srcDirs += "src/ondevice/kotlin"
        }
        // The model servers are executables: Android runs them only from the
        // extracted native library directory.
        packaging { jniLibs { useLegacyPackaging = true } }
        buildTypes {
            release { proguardFile "src/ondevice/proguard-rules.pro" }
        }
    }
    chaquopy {
        defaultConfig { version "3.13" }
        sourceSets {
            main {
                srcDir "../../assistant_backend"
                srcDir "../../assets/assistant"
                exclude "test_*.py", "evaluate.py", "eval_holdout.py", "evaluation.json", "README.md"
            }
        }
    }
}
