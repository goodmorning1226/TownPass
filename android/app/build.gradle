plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "com.example.townpass"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "29.0.13113456"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.townpass"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

// Flutter's --dart-define values (Flutter hands them to Gradle base64-encoded in
// the dart-defines property), so Android takes the same build flags as iOS
// (docs/AI_ON_DEVICE_IOS.md): ASSISTANT_ON_DEVICE=true, ASSISTANT_SPEECH,
// ASSISTANT_DECISION_MODEL.
def dartDefines = (project.findProperty("dart-defines") ?: "").toString().split(",")
    .findAll { it }
    .collect { new String(it.decodeBase64(), "UTF-8") }
    .findAll { it.contains("=") }
    .collectEntries { define -> [define.substring(0, define.indexOf("=")), define.substring(define.indexOf("=") + 1)] }

// On-device assistant (docs/AI_ON_DEVICE_PLAN.md). Opt-in with
// --dart-define=ASSISTANT_ON_DEVICE=true (the same flag as iOS), TOWNPASS_ON_DEVICE=1
// or -Ptownpass.onDevice=true; other builds are unchanged. Packs the Python
// backend (Chaquopy) and the llama.cpp / whisper.cpp servers built by
// scripts/build_assistant_native.ps1. 64-bit devices only.
def assistantOnDevice = ["1", "true"].contains(
    (project.findProperty("townpass.onDevice") ?: System.getenv("TOWNPASS_ON_DEVICE")
        ?: dartDefines["ASSISTANT_ON_DEVICE"] ?: "").toString().trim().toLowerCase())
if (assistantOnDevice) {
    apply plugin: "com.chaquo.python"
    // TOWNPASS_SPEECH=system (or ASSISTANT_SPEECH=system): the phone's own speech
    // recogniser, no Whisper (docs/AI_ASR_ABLATION.md); default whisper.
    def assistantWhisper = (project.findProperty("townpass.speech") ?: System.getenv("TOWNPASS_SPEECH")
        ?: dartDefines["ASSISTANT_SPEECH"] ?: "whisper").toString() != "system"
    // TOWNPASS_DECISION_MODEL=gemma (or ASSISTANT_DECISION_MODEL=gemma): Gemma 4 E2B
    // instead of Ministral 3B as the decision model (docs/AI_DECISION_MODEL_ABLATION_PLAN.md
    // section 8); ministral: Ministral 3B. Default classifier (since 2026-11-13): no decision
    // model at all, the decision classifier instead (option B', docs/AI_DECISION_CLASSIFIER.md
    // section 12; docs/AI_CURRENT_RULES.md section 6).
    def assistantDecisionModel = (project.findProperty("townpass.decisionModel")
        ?: System.getenv("TOWNPASS_DECISION_MODEL") ?: dartDefines["ASSISTANT_DECISION_MODEL"]
        ?: "classifier").toString().trim().toLowerCase()
    if (!["ministral", "gemma", "classifier"].contains(assistantDecisionModel)) {
        throw new GradleException("TOWNPASS_DECISION_MODEL must be ministral, gemma or classifier, not $assistantDecisionModel")
    }
    android {
        buildFeatures { resValues = true }  // off by default since AGP 9
        defaultConfig {
            ndk { abiFilters "arm64-v8a", "x86_64" }
            resValue "bool", "assistant_whisper", assistantWhisper.toString()
            resValue "string", "assistant_decision_model", assistantDecisionModel
        }
        sourceSets.main {
            jniLibs.srcDirs += "assistant-native/jniLibs"
            java.srcDirs += "src/ondevice/kotlin"
        }
        // The model servers are executables: Android runs them only from the
        // extracted native library directory.
        packaging { jniLibs { useLegacyPackaging = true } }
        buildTypes {
            release { proguardFile "src/ondevice/proguard-rules.pro" }
        }
    }
    chaquopy {
        defaultConfig { version "3.13" }
        sourceSets {
            main {
                srcDir "../../assistant_backend"
                srcDir "../../assets/assistant"
                exclude "test_*.py", "evaluate.py", "eval_holdout.py", "eval_sound.py", "eval_guides.py", "evaluation.json", "data/guide_eval*.json", "README.md"
            }
        }
    }
}
