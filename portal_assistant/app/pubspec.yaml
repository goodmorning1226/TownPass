name: townpass_portal_assistant
description: "On-device service assistant for the TownPass (台北通) App: guided tutorials on the real service pages, chat panel, page translation."
publish_to: 'none'

version: 0.1.0

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

# The host App (TownPass) depends on this package with a path dependency and
# registers a PortalAssistantHost (lib/host/portal_assistant_host.dart);
# portal_assistant/INTEGRATION.md lists every hook. This package never imports
# the host App.
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_tts: ^4.2.5
  get: ^4.7.3
  google_mlkit_translation: 0.15.1
  # Exact versions: the ones tested on phones (7.2 splits the iOS/macOS
  # plugin). A host App whose pubspec.lock has no entry for them would
  # otherwise resolve newer ones.
  record: 7.1.2
  # The record plugin's platform parts, pinned for the same reason.
  record_android: 2.2.0
  record_linux: 2.1.3
  record_platform_interface: 2.1.0
  record_web: 2.1.3
  record_windows: 2.3.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Loaded by the host App as packages/townpass_portal_assistant/assets/...
  # (lib/host/assistant_assets.dart).
  assets:
    - assets/assistant/
    - assets/i18n/
    - assets/i18n/guide/
    - assets/image/
