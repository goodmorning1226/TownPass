# Builds an unsigned iPhone .ipa of the on-device assistant on a GitHub macOS runner,
# for testing from a Windows PC without a Mac (docs/IOS_BUILD_WITHOUT_MAC.md).
# The .ipa is then signed and installed with Sideloadly; the App downloads its
# models itself (docs/AI_MODEL_DOWNLOAD.md).
#
# Runs on pushes to the ci/ios-build branch only (and by hand). Not meant for main
# or for upstream: it changes nothing in the App.
name: iOS build (unsigned, on-device assistant)

on:
  push:
    branches: [ci/ios-build]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NATIVE: ${{ github.workspace }}/../native
      LOGS: ${{ github.workspace }}/../logs
      LLAMA_TAG: b12182
      WHISPER_TAG: v1.9.5
    steps:
      - uses: actions/checkout@v4

      # device_info_plus 13.3 uses iOS 26 SDK APIs (isiOSAppOnVision): build with the
      # newest Xcode 26 on the image, not the image's default Xcode 16.
      - name: Versions
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::no Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          FLUTTER=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")
          echo "FLUTTER_VERSION=$FLUTTER" >> "$GITHUB_ENV"
          echo "Flutter $FLUTTER (.fvmrc)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The native frameworks take most of the time; kept between runs while the
      # tags and our patches stay the same.
      - name: Cache native frameworks
        id: native
        uses: actions/cache@v4
        with:
          path: ${{ env.NATIVE }}/ios-out
          key: ios-native-${{ env.LLAMA_TAG }}-${{ env.WHISPER_TAG }}-${{ hashFiles('ios/native/**', 'scripts/build_ios_llama_server.sh', 'scripts/build_ios_whisper_server.sh') }}

      - name: Build LlamaServer and WhisperServer frameworks
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$LOGS"; exec > >(tee "$LOGS/native.log") 2>&1
          brew list ninja >/dev/null 2>&1 || brew install ninja
          mkdir -p "$NATIVE"
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$NATIVE/llama.cpp"
          git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp "$NATIVE/whisper.cpp"
          scripts/build_ios_llama_server.sh "$NATIVE/llama.cpp" "$NATIVE/ios-out"
          scripts/build_ios_whisper_server.sh "$NATIVE/whisper.cpp" "$NATIVE/ios-out"

      # CPython for iOS from BeeWare's Python-Apple-support (the newest 3.13 build).
      - name: Python framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$LOGS"; exec > >(tee "$LOGS/python.log") 2>&1
          TAG=$(gh release list -R beeware/Python-Apple-support --limit 50 --json tagName \
            --jq '[.[].tagName | select(startswith("3.13-b"))][0]')
          echo "Python-Apple-support $TAG"
          mkdir -p "$NATIVE/python-ios-$TAG"
          gh release download "$TAG" -R beeware/Python-Apple-support --pattern 'Python-3.13-iOS-support.*.tar.gz' \
            --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/Python-3.13-iOS-support.*.tar.gz -C "$NATIVE/python-ios-$TAG"
          ls "$NATIVE/python-ios-$TAG"

      - name: Put the frameworks in ios/OnDevice
        run: |
          mkdir -p "$LOGS"; exec > >(tee "$LOGS/setup.log") 2>&1
          scripts/setup_ios_on_device.sh "$NATIVE"

      - name: Flutter packages and generated code
        run: |
          mkdir -p "$LOGS"; exec > >(tee "$LOGS/flutter-pub.log") 2>&1
          flutter --version
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs

      - name: Build (release, not signed)
        run: |
          mkdir -p "$LOGS"; exec > >(tee "$LOGS/flutter-build.log") 2>&1
          flutter build ios --release --no-codesign \
            --dart-define=ASSISTANT_ENABLED=true --dart-define=ASSISTANT_ON_DEVICE=true \
            --dart-define=ASSISTANT_DECISION_MODEL=classifier --dart-define=ASSISTANT_GUIDED=true
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP/Frameworks/LlamaServer.framework"
          test -d "$APP/Frameworks/WhisperServer.framework"
          test -d "$APP/Frameworks/Python.framework"
          test -f "$APP/assistant_backend/models.json"
          du -sh "$APP"

      - name: Package .ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry "../TownPass-assistant-unsigned.ipa" Payload)
          ls -lh TownPass-assistant-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TownPass-assistant-unsigned-ipa
          path: TownPass-assistant-unsigned.ipa
          retention-days: 14

      # The job log needs a GitHub login; annotations are public, so the end of a
      # failed step's output can be read from the API without one.
      - name: Show the end of a failed step
        if: failure()
        run: |
          for log in "$LOGS"/*.log; do
            [ -f "$log" ] || continue
            text=$(tail -n 60 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename "$log" .log)::$text"
            # Compiler errors scroll away behind warnings: list them separately.
            errors=$(grep -n -E "error:|Error \(Xcode\)|: error|Failed to build" "$log" | grep -v "warning:" | head -n 40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$errors" ] && echo "::error title=$(basename "$log" .log) errors::$errors"
          done
          # The Xcode build's own log has the full compiler messages.
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcactivitylog" -newer "$LOGS" 2>/dev/null | head -n 1 \
            | while read -r f; do gunzip -c "$f" | tr '\r' '\n' | grep -E "error:" | head -n 30 \
              | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | xargs -0 -I{} echo "::error title=xcode errors::{}"; done || true
